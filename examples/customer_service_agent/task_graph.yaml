schema_version: "0.1"
kind: "TaskGraphSpec"
metadata:
  name: "customer-service-agent-task-graph"
  version: "1.0.0"
graph_type: "langgraph_state_graph"
state_schema: "agent_runtime_state.v1"
nodes:
  understand:
    type: "model"
    purpose: "understand_task"
  route:
    type: "router"
    routes:
      - when: "needs_capability"
        to: "execute_capability"
      - when: "needs_user_input"
        to: "ask_user"
      - when: "ready"
        to: "compose_final"
      - when: "end"
        to: "END"
  execute_capability:
    type: "capability"
    capability_ref: "auto"
  ask_user:
    type: "interrupt"
    interrupt_type: "user_input_required"
  compose_final:
    type: "model"
    purpose: "final_answer"
edges:
  - from: "START"
    to: "understand"
  - from: "understand"
    to: "route"
  - from: "execute_capability"
    to: "route"
  - from: "ask_user"
    to: "route"
  - from: "compose_final"
    to: "END"

schema_version: "0.1"
kind: "GuardrailSpec"
metadata:
  name: "customer-service-agent"
  version: "1.0.0"
rules:
  - id: "high_risk_tool_confirm"
    stage: "tool"
    action: "human_confirm"
    risk_level: "high"
    description: "高风险工具必须确认"
  - id: "no_fake_refund"
    stage: "output"
    action: "warn"
    risk_level: "medium"
    description: "不能声称已完成真实退款"

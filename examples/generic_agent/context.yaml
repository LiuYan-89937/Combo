schema_version: "0.1"
kind: "ContextSpec"
metadata:
  name: "sample-agent-context"
  version: "1.0.0"
sources:
  - id: "agent_instructions"
    type: "static"
    content: "资料整理 Agent 需要以温和、专业方式处理请求处理、政策查询、转人工和记录查询。"
    visible_to_model: true
    visible_to_tools: false
    hidden_from_model: []
  - id: "sample_policy_kb"
    type: "mcp"
    ref: "mcp.sample_kb.search_policy"
    visible_to_model: true
    visible_to_tools: true
    hidden_from_model:
      - "authorization"
      - "tool_auth_token"
max_visible_items: 8
redact_fields:
  - "api_key"
  - "secret"
  - "authorization"
  - "auth_header"
  - "tool_auth_token"

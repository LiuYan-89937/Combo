schema_version: "0.1"
kind: "EnvironmentProbeReport"
metadata:
  name: "sample-agent-environment"
  version: "1.0.0"
  description: "资料整理 Agent environment preflight example"
preconditions: []
probes: []
shell_capabilities:
  - id: "shell.command"
    allowed_commands:
      - "python"
      - "python3"
    allowed_scripts: []
    proposal_only: true
    approval_required: true
    sandbox_required: true
    timeout_seconds: 10
    risk_level: "high"

schema_version: "0.1"
kind: "MCPBindingSpec"
metadata:
  name: "sample-agent-mcp"
  version: "1.0.0"
servers:
  - id: "sample_policy_kb"
    source_ref: "mcp.sample_kb.search_policy"
    transport: "stdio"
    command: "python3"
    args:
      - "examples/mcp/sample_kb_server.py"
    enabled: false
    health_check:
      enabled: true
bindings:
  - id: "sample_policy_search"
    source_id: "sample_policy_kb"
    capability_ref: "mcp.sample_policy_kb.search_policy@1.0.0"
    risk_level: "low"
    visible_to_model: true
    proposal_only: false
    input_mapping:
      strategy: "pass_through"
    output_mapping:
      strategy: "sanitized_json"

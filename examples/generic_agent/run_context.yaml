schema_version: "0.1"
kind: "RunContextSpec"
metadata:
  name: "sample-agent"
  version: "1.0.0"
namespace_template: "agent:{agent_name}:version:{version}:instance:{instance_id}"
dependency_refs:
  - "model.default"
  - "toolset.sample_toolset"
access_policy:
  model: true
  tools: true
  mcp: true
  context: true
  memory: true
  registry: false
trace_required: true
session_required: true

pattern_id: factory_manufacturing
kind: main
embeddable: false
version: 1
name: Factory Manufacturing Product Brief Runtime Design Capability Contract Tool Manufacturing Scheduler Preparation and Package Build
description: FastAgentFactory create-agent workflow materializes an AgentPackage after tool manufacturing, scheduler seed preparation, and package build.
metadata:
  summary: Runs Product Brief, maps it into a Kernel-valid Runtime Design, freezes capability contracts, manufactures tools through the shared tool chain, prepares confirmed scheduler seeds, materializes AgentPackage files, and stops before sandbox validation.
  use_when:
    - The user wants to create or refine an AgentPackage through the factory.
  avoid_when: []
  selection_notes:
    - This SystemPackage intentionally stops after Package Build until runtime validation is designed.
  tags:
    - factory
    - manufacturing
    - system-package
entry_node: product_brief
nodes:
  - id: product_brief
    type: cognitive
    impl: builtin.factory.product_brief
  - id: runtime_design
    type: cognitive
    impl: builtin.factory.runtime_design
  - id: capability_contract
    type: cognitive
    impl: builtin.factory.capability_contract
  - id: tool_manufacturing
    type: cognitive
    impl: builtin.factory.tool_manufacturing
  - id: scheduler_preparation
    type: cognitive
    impl: builtin.factory.scheduler_preparation
  - id: package_build
    type: cognitive
    impl: builtin.factory.package_build
edges:
  - from: product_brief
    to: runtime_design
    when: always
  - from: runtime_design
    to: capability_contract
    when: always
  - from: capability_contract
    to: tool_manufacturing
    when: always
  - from: tool_manufacturing
    to: scheduler_preparation
    when: always
  - from: scheduler_preparation
    to: package_build
    when: always
interrupt_points: []
termination:
  success_nodes:
    - package_build
  failure_nodes: []
constraints:
  allowed_node_types:
    - cognitive
  required_capabilities:
    - context
input_contract:
  readable_sections:
    - package_state
    - conversation
  writable_sections: []
output_contract:
  readable_sections: []
  writable_sections:
    - package_state
    - conversation
    - execution
exit_routes: []
state_mode: shared

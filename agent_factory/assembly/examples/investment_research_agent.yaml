schema_version: "0.1"
agent:
  id: investment_research_agent
  description: Investment research assistant.
runtime:
  pattern_id: react_agent
  user_config:
    locale: zh-CN
    tone: concise
graph_overrides:
  node_wrappers:
    - node_id: answer
      wrappers:
        - id: context.prepare_model_context
          phase: before
          order: 10
          config:
            include_user_config: true
tools:
  - id: sec_filing_search
    description: Search public filing snippets already available to the generated agent runtime.
    entrypoint: tools/sec_filing_search/tool.py:run
    input_schema:
      type: object
      properties:
        query:
          type: string
      required:
        - query
      additionalProperties: false
    output_schema:
      type: object
      properties:
        results:
          type: array
          items:
            type: string
      required:
        - results
      additionalProperties: false
    resources: {}
    risk_level: low
    risk_evaluator: {}
    concurrent: true
  - id: price_chart
    description: Read price chart data already available to the generated agent runtime.
    entrypoint: tools/price_chart/tool.py:run
    input_schema:
      type: object
      properties:
        symbol:
          type: string
      required:
        - symbol
      additionalProperties: false
    output_schema:
      type: object
      properties:
        chart:
          type: string
      required:
        - chart
      additionalProperties: false
    resources: {}
    risk_level: low
    risk_evaluator: {}
    concurrent: true
output:
  citations_required: true
  format: markdown
harness:
  - scenario_id: basic_answer
    input_text: summarize apple filing
    user_config:
      preferences: likes citations
    assertions:
      - type: path_ordered
        expected_node_ids:
          - ingress
          - answer
      - type: output_contains
        expected: final

pattern_id: scheduled_react_report
kind: main
embeddable: false
version: 1
name: Scheduled ReAct Report
description: Scheduled report agent that lets the model decide tool use through the standard ReAct loop.
metadata:
  summary: Top-level pattern for agents that can be triggered by scheduler jobs or chat requests to gather data, analyze it, and publish a report through normal ReAct tool calls.
  use_when:
    - The Agent needs recurring reports, briefings, monitoring summaries, or scheduled notifications.
    - The Agent should choose tools dynamically based on configured user resources and current inputs.
    - The workflow needs scheduler, tools, artifact output, trace, and memory/context but should not hard-code a bespoke graph.
  avoid_when:
    - The domain requires a fixed deterministic ETL pipeline that must be implemented by package-local nodes.
    - The Agent should only answer ad-hoc chat without scheduled runs.
  selection_notes:
    - "This pattern preserves Kernel tool semantics: operational.tool_call only executes tool_calls produced by the cognitive answer node."
    - Use scheduler jobs to inject the recurring report request as a graph_run message.
  tags:
    - scheduled
    - report
    - react
    - tool-use
    - main
entry_node: ingress
nodes:
  - id: ingress
    type: reserved
    impl: ingress
  - id: precheck
    type: governance
    impl: governance.precheck
  - id: approval_gate
    type: governance
    impl: governance.approval_gate
  - id: answer
    type: cognitive
    impl: cognitive.answer
  - id: tool_exec
    type: operational
    impl: operational.tool_call
  - id: postcheck
    type: governance
    impl: governance.postcheck
  - id: commit
    type: terminal
    impl: terminal.commit
  - id: finalize
    type: reserved
    impl: finalize
edges:
  - from: ingress
    to: precheck
    when: always
  - from: precheck
    to: finalize
    when: policy.blocked
  - from: precheck
    to: approval_gate
    when: policy.approval_required
  - from: precheck
    to: answer
    when: always
  - from: approval_gate
    to: answer
    when: always
  - from: answer
    to: tool_exec
    when: model.requests_tool
  - from: answer
    to: postcheck
    when: model.ready_to_answer
  - from: tool_exec
    to: answer
    when: tool.completed
  - from: tool_exec
    to: answer
    when: tool.failed
  - from: tool_exec
    to: finalize
    when: tool.interrupted
  - from: tool_exec
    to: finalize
    when: policy.blocked
  - from: postcheck
    to: finalize
    when: policy.blocked
  - from: postcheck
    to: finalize
    when: policy.approval_required
  - from: postcheck
    to: commit
    when: always
  - from: commit
    to: finalize
    when: always
interrupt_points:
  - precheck
  - tool_exec
termination:
  success_nodes:
    - finalize
  failure_nodes: []
constraints:
  allowed_node_types:
    - reserved
    - cognitive
    - operational
    - governance
    - terminal
    - sub_graph
  required_capabilities:
    - prompt
    - tools
    - context
    - checkpoint
    - observability
input_contract:
  readable_sections: []
  writable_sections: []
output_contract:
  readable_sections: []
  writable_sections: []
slots:
  - slot_id: recurring_report_request
    slot_type: scheduler
    node_id: ingress
    required: true
    purpose: Optional recurring graph_run message used to ask the Agent to produce the report.
    expected_binding: scheduler job target graph_run with a natural-language message.
  - slot_id: answer_prompt
    slot_type: prompt
    node_id: answer
    required: true
    purpose: Runtime prompt that explains the report domain, user-facing style, and tool-use policy.
    expected_binding: prompt binding for the answer node.
  - slot_id: report_tools
    slot_type: tool
    node_id: answer
    required: true
    purpose: Tools the answer node may request for retrieval, analysis support, formatting, or delivery.
    expected_binding: tool_access binding shared with tool_exec.
  - slot_id: report_runtime_config
    slot_type: resource
    node_id: answer
    required: true
    purpose: User-configurable report inputs such as symbols, sources, schedule, risk preference, or delivery target.
    expected_binding: resources contract and state defaults; values must be runtime data, not only descriptions.
  - slot_id: report_artifacts
    slot_type: artifact
    node_id: commit
    required: false
    purpose: Optional report files or structured diagnostics written through artifact/report services.
    expected_binding: artifact contract.
exit_routes: []
state_mode: shared

pattern_id: clarification_loop_v1
kind: subgraph
embeddable: true
version: 1
name: Clarification Loop
description: Minimal subgraph used for recursive pattern compilation.
metadata:
  summary: Reusable subgraph for asking clarifying questions and returning a compact route.
  use_when:
    - A parent pattern needs a bounded clarification loop before continuing.
    - Missing user input should be collected without exposing the full parent graph.
  avoid_when:
    - The Agent should be selected as a top-level runtime pattern.
  selection_notes:
    - This pattern is embeddable and should normally not appear in end-user top-level pattern selection.
  tags:
    - clarification
    - subgraph
    - reusable
entry_node: clarify
nodes:
  - id: clarify
    type: cognitive
    impl: cognitive.clarify
  - id: route_after_clarify
    type: cognitive
    impl: cognitive.route
  - id: finalize
    type: reserved
    impl: finalize
edges:
  - from: clarify
    to: route_after_clarify
    when: always
  - from: route_after_clarify
    to: finalize
    when: subgraph.done
  - from: route_after_clarify
    to: finalize
    when: subgraph.need_more_input
  - from: route_after_clarify
    to: finalize
    when: subgraph.blocked
interrupt_points: []
termination:
  success_nodes:
    - finalize
  failure_nodes: []
constraints:
  allowed_node_types:
    - reserved
    - cognitive
    - operational
    - governance
    - terminal
    - sub_graph
  required_capabilities: []
input_contract:
  readable_sections:
    - conversation
    - context
    - policy
  writable_sections: []
output_contract:
  readable_sections: []
  writable_sections:
    - conversation
    - execution
    - policy
exit_routes:
  - done
  - need_more_input
  - blocked
state_mode: shared

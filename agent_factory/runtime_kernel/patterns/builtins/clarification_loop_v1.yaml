pattern_id: clarification_loop_v1
kind: subgraph
embeddable: true
version: 1
name: Clarification Loop
description: Minimal subgraph used for recursive pattern compilation.
entry_node: clarify
nodes:
  - id: clarify
    type: cognitive
    impl: cognitive.clarify
  - id: route_after_clarify
    type: cognitive
    impl: cognitive.route
  - id: finalize
    type: reserved
    impl: finalize
edges:
  - from: clarify
    to: route_after_clarify
    when: always
  - from: route_after_clarify
    to: finalize
    when: subgraph.done
  - from: route_after_clarify
    to: finalize
    when: subgraph.need_more_input
  - from: route_after_clarify
    to: finalize
    when: subgraph.blocked
interrupt_points: []
termination:
  success_nodes:
    - finalize
  failure_nodes: []
constraints:
  allowed_node_types:
    - reserved
    - cognitive
    - operational
    - governance
    - terminal
    - sub_graph
  required_capabilities: []
input_contract:
  readable_sections:
    - conversation
    - context
    - policy
  writable_sections: []
output_contract:
  readable_sections: []
  writable_sections:
    - conversation
    - execution
    - policy
exit_routes:
  - done
  - need_more_input
  - blocked
state_mode: shared

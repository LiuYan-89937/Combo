pattern_id: react_agent
kind: main
embeddable: false
version: 1
name: ReAct Agent
description: Standard conversational tool-using agent.
metadata:
  summary: Top-level conversational agent pattern for dynamic reasoning and tool use.
  use_when:
    - The Agent needs to reason, call tools, observe results, and continue iterating.
    - User tasks are open-ended or may require different tool paths per request.
    - The Agent benefits from knowledge retrieval, policy checks, and postcheck before commit.
  avoid_when:
    - The Agent should always ask a fixed clarification sequence before any action.
    - The work is a rigid workflow with deterministic stages and little dynamic tool choice.
  selection_notes:
    - This is the default choice for CLI-first agents with dynamic ReAct behavior.
    - Prefer clarify_then_act when action should never start before missing required inputs are resolved.
  tags:
    - react
    - tool-use
    - conversational
    - main
entry_node: ingress
nodes:
  - id: ingress
    type: reserved
    impl: ingress
  - id: knowledge_retrieve
    type: operational
    impl: operational.knowledge_retrieve
  - id: precheck
    type: governance
    impl: governance.precheck
  - id: approval_gate
    type: governance
    impl: governance.approval_gate
  - id: answer
    type: cognitive
    impl: cognitive.answer
  - id: tool_exec
    type: operational
    impl: operational.tool_call
  - id: postcheck
    type: governance
    impl: governance.postcheck
  - id: commit
    type: terminal
    impl: terminal.commit
  - id: finalize
    type: reserved
    impl: finalize
edges:
  - from: ingress
    to: knowledge_retrieve
    when: always
  - from: knowledge_retrieve
    to: precheck
    when: always
  - from: precheck
    to: finalize
    when: policy.blocked
  - from: precheck
    to: approval_gate
    when: policy.approval_required
  - from: precheck
    to: answer
    when: always
  - from: approval_gate
    to: answer
    when: always
  - from: answer
    to: tool_exec
    when: model.requests_tool
  - from: answer
    to: postcheck
    when: model.ready_to_answer
  - from: tool_exec
    to: answer
    when: tool.completed
  - from: tool_exec
    to: answer
    when: tool.failed
  - from: tool_exec
    to: finalize
    when: tool.interrupted
  - from: tool_exec
    to: finalize
    when: policy.blocked
  - from: postcheck
    to: finalize
    when: policy.blocked
  - from: postcheck
    to: finalize
    when: policy.approval_required
  - from: postcheck
    to: commit
    when: always
  - from: commit
    to: finalize
    when: always
interrupt_points:
  - precheck
  - tool_exec
termination:
  success_nodes:
    - finalize
  failure_nodes: []
constraints:
  allowed_node_types:
    - reserved
    - cognitive
    - operational
    - governance
    - terminal
    - sub_graph
  required_capabilities: []
input_contract:
  readable_sections: []
  writable_sections: []
output_contract:
  readable_sections: []
  writable_sections: []
exit_routes: []
state_mode: shared

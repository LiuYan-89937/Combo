<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">FastAgentFactory 后端架构展示图</title>
  <desc id="desc">展示前端接入、Factory 控制面、AgentPackage 运行面、AMD 本地推理与持久化基础设施之间的关系。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#102a44"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#27c2ff"/>
      <stop offset="1" stop-color="#776cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5bd6ff"/>
    </marker>
    <style>
      .title { fill: #f4f9ff; font: 700 38px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #9bb1c8; font: 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .layer-title { fill: #69d9ff; font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1px; }
      .box-title { fill: #f4f9ff; font: 650 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .box-copy { fill: #aebed0; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tag { fill: #d7e7f5; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .layer { fill: #0d2035; stroke: #28445f; stroke-width: 1.5; }
      .box { fill: #132c45; stroke: #3c607d; stroke-width: 1.4; }
      .box-accent { fill: #132c45; stroke: url(#accent); stroke-width: 2; }
      .flow { fill: none; stroke: #5bd6ff; stroke-width: 2.2; marker-end: url(#arrow); }
      .soft-flow { fill: none; stroke: #6d8ba5; stroke-width: 1.7; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1440" height="900" rx="26" fill="url(#background)"/>
  <text x="72" y="72" class="title">FastAgentFactory · Local Agent Platform</text>
  <text x="72" y="106" class="subtitle">Agent 控制面、隔离运行时、工具工作流与 AMD ROCm 本地推理</text>

  <g filter="url(#shadow)">
    <rect x="60" y="145" width="1320" height="120" rx="20" class="layer"/>
    <text x="84" y="180" class="layer-title">01 · 接入与交互层</text>
    <rect x="85" y="198" width="250" height="48" rx="12" class="box"/>
    <text x="210" y="228" text-anchor="middle" class="box-title">Vue Web Frontend</text>
    <rect x="390" y="198" width="250" height="48" rx="12" class="box"/>
    <text x="515" y="228" text-anchor="middle" class="box-title">HTTP API</text>
    <rect x="695" y="198" width="250" height="48" rx="12" class="box"/>
    <text x="820" y="228" text-anchor="middle" class="box-title">SSE Runtime Events</text>
    <rect x="1000" y="198" width="350" height="48" rx="12" class="box"/>
    <text x="1175" y="228" text-anchor="middle" class="box-title">状态 · 会话 · Workspace · Benchmark</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="60" y="300" width="1320" height="170" rx="20" class="layer"/>
    <text x="84" y="336" class="layer-title">02 · FACTORY 控制面</text>
    <rect x="85" y="356" width="280" height="82" rx="14" class="box-accent"/>
    <text x="225" y="388" text-anchor="middle" class="box-title">FactoryRuntimeAdapter</text>
    <text x="225" y="414" text-anchor="middle" class="box-copy">统一命令、事件与运行状态</text>
    <rect x="400" y="356" width="210" height="82" rx="14" class="box"/>
    <text x="505" y="388" text-anchor="middle" class="box-title">Session</text>
    <text x="505" y="414" text-anchor="middle" class="box-copy">普通 / 协作分流</text>
    <rect x="645" y="356" width="210" height="82" rx="14" class="box"/>
    <text x="750" y="388" text-anchor="middle" class="box-title">Manufacture</text>
    <text x="750" y="414" text-anchor="middle" class="box-copy">制造与验证</text>
    <rect x="890" y="356" width="210" height="82" rx="14" class="box"/>
    <text x="995" y="388" text-anchor="middle" class="box-title">Collaboration</text>
    <text x="995" y="414" text-anchor="middle" class="box-copy">任务编排与 Worker</text>
    <rect x="1135" y="356" width="215" height="82" rx="14" class="box"/>
    <text x="1242" y="388" text-anchor="middle" class="box-title">Resource Control</text>
    <text x="1242" y="414" text-anchor="middle" class="box-copy">模型、知识与凭证</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="60" y="505" width="840" height="260" rx="20" class="layer"/>
    <text x="84" y="541" class="layer-title">03 · AGENTPACKAGE 运行面</text>
    <rect x="85" y="564" width="245" height="82" rx="14" class="box-accent"/>
    <text x="207" y="596" text-anchor="middle" class="box-title">Runtime Manager</text>
    <text x="207" y="622" text-anchor="middle" class="box-copy">Package / Session / Container</text>
    <rect x="360" y="564" width="245" height="82" rx="14" class="box"/>
    <text x="482" y="596" text-anchor="middle" class="box-title">RuntimeBuildPlanner</text>
    <text x="482" y="622" text-anchor="middle" class="box-copy">Contract 与能力装配</text>
    <rect x="635" y="564" width="240" height="82" rx="14" class="box"/>
    <text x="755" y="596" text-anchor="middle" class="box-title">RuntimeKernel</text>
    <text x="755" y="622" text-anchor="middle" class="box-copy">Compiled LangGraph</text>
    <rect x="85" y="675" width="170" height="58" rx="12" class="box"/>
    <text x="170" y="710" text-anchor="middle" class="tag">Planning</text>
    <rect x="280" y="675" width="170" height="58" rx="12" class="box"/>
    <text x="365" y="710" text-anchor="middle" class="tag">Tool Calling</text>
    <rect x="475" y="675" width="170" height="58" rx="12" class="box"/>
    <text x="560" y="710" text-anchor="middle" class="tag">RAG / Memory</text>
    <rect x="670" y="675" width="205" height="58" rx="12" class="box"/>
    <text x="772" y="710" text-anchor="middle" class="tag">Checkpoint / Trace</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="935" y="505" width="445" height="260" rx="20" class="layer"/>
    <text x="959" y="541" class="layer-title">04 · AMD 本地推理</text>
    <rect x="960" y="564" width="190" height="82" rx="14" class="box-accent"/>
    <text x="1055" y="596" text-anchor="middle" class="box-title">llama.cpp</text>
    <text x="1055" y="622" text-anchor="middle" class="box-copy">GGUF · ROCm · HIP</text>
    <rect x="1170" y="564" width="185" height="82" rx="14" class="box"/>
    <text x="1262" y="596" text-anchor="middle" class="box-title">Model Server</text>
    <text x="1262" y="622" text-anchor="middle" class="box-copy">Chat · Embed · Vision</text>
    <rect x="960" y="675" width="190" height="58" rx="12" class="box"/>
    <text x="1055" y="710" text-anchor="middle" class="tag">Official / AMD</text>
    <rect x="1170" y="675" width="185" height="58" rx="12" class="box"/>
    <text x="1262" y="710" text-anchor="middle" class="tag">rocprof · Benchmark</text>
  </g>

  <path d="M 515 246 L 515 294" class="flow"/>
  <path d="M 820 294 L 820 252" class="soft-flow"/>
  <path d="M 225 438 L 225 558" class="flow"/>
  <path d="M 330 605 L 354 605" class="flow"/>
  <path d="M 605 605 L 629 605" class="flow"/>
  <path d="M 875 605 L 954 605" class="flow"/>
  <path d="M 1150 605 L 1164 605" class="flow"/>
  <path d="M 1262 652 L 1262 669" class="soft-flow"/>

  <text x="72" y="825" class="subtitle">完全本地部署 · 会话级工作区隔离 · 统一 Tool Gateway · 可观测推理优化</text>
  <rect x="72" y="848" width="1296" height="2" fill="url(#accent)" opacity="0.8"/>
</svg>

[project]
name = "fast-agent-factory"
version = "0.1.0"
description = "CLI-first Agent factory framework with reproducible runtime and lifecycle controls."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "langgraph>=1.0,<2",
    "playwright>=1.45",
    "prompt_toolkit>=3.0",
    "pydantic>=2.8",
    "pypdf>=4.0",
    "rich>=13.0",
    "ruamel.yaml>=0.18",
    "typer>=0.12",
]

[project.scripts]
agentfactory = "agent_factory.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_factory"]

[tool.uv]
package = true

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[project]
name = "fast-agent-factory"
version = "0.1.0"
description = "CLI-first Agent factory framework with reproducible runtime and lifecycle controls."
readme = "docs/README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "langgraph>=1.0,<2",
    "prompt_toolkit>=3.0",
    "pydantic>=2.8",
    "rich>=13.0",
    "ruamel.yaml>=0.18",
    "typer>=0.12",
]

[project.scripts]
agentfactory = "agent_factory.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[project]
name = "fast-agent-factory"
version = "0.1.0"
description = "CLI-first Agent factory framework with reproducible runtime and lifecycle controls."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "langchain>=1.2,<2",
    "langchain-core>=1.3,<2",
    "langchain-openai>=1.1,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=2.0,<3",
    "jsonschema>=4.23",
    "mcp>=1.0",
    "playwright>=1.45",
    "pydantic>=2.8",
    "pypdf>=4.0",
    "ruamel.yaml>=0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_factory"]

[tool.uv]
package = true

[project.optional-dependencies]
dev = []

[tool.ruff]
line-length = 100
target-version = "py311"

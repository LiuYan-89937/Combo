[project]
name = "combo"
version = "0.1.0"
description = "Dynamic agent collaboration runtime with reproducible lifecycle controls."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "cryptography>=42",
    "httpx[socks]>=0.27",
    "langchain>=1.2,<2",
    "langchain-core>=1.3,<2",
    "langchain-community>=0.4,<1",
    "langchain-openai>=1.1,<2",
    "langchain-text-splitters>=1.0,<2",
    "langgraph==1.2.10",
    "langgraph-checkpoint>=4.1,<5",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "langgraph-checkpoint-redis>=0.5,<1",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langgraph-store-mongodb>=0.3,<1",
    "ebooklib>=0.19",
    "mammoth>=1.9,<2",
    "markdownify>=1.2,<2",
    "odfpy>=1.4,<2",
    "olefile>=0.47,<1",
    "openpyxl>=3.1,<4",
    "apscheduler>=3.11,<4",
    "jsonschema>=4.23",
    "mcp>=1.0",
    "packaging>=24",
    "uritemplate>=4.1,<5",
    "pydantic>=2.8",
    "playwright>=1.54,<2",
    "pypdf>=4.0",
    "python-pptx>=1.0,<2",
    "ruamel.yaml>=0.18",
    "langchain-anthropic>=1.1,<2",
    "striprtf>=0.0.29,<1",
    "xlrd>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["combo"]

[tool.uv]
package = true

[project.optional-dependencies]
dev = []
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.ruff]
line-length = 100
target-version = "py311"

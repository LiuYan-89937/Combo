<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="78%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
    <mask id="fade">
      <rect width="1200" height="630" fill="url(#dotsMaskGrad)"/>
    </mask>
    <radialGradient id="dotsMaskGrad" cx="80%" cy="16%" r="62%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#dots)" mask="url(#fade)"/>

  <!-- brand mark -->
  <g transform="translate(96,150)">
    <rect width="64" height="64" rx="18" fill="#ffffff"/>
    <rect x="26" y="26" width="12" height="12" rx="4" fill="#000000"/>
  </g>

  <text x="180" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#a3a3a3" letter-spacing="1">FastAgentFactory</text>

  <text x="92" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="700" fill="#ffffff" letter-spacing="-3">制造真正能</text>
  <text x="92" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="700" fill="#ffffff" letter-spacing="-3">工作的 Agent</text>

  <text x="96" y="558" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#737373">Local-first · Cross-platform · Build · Run · Distribute</text>
</svg>

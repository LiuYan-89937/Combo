[project]
name = "fastagenthub"
version = "0.1.0"
description = "FastAgentFactory website authentication and application release service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "oss2>=2.19,<3",
    "pydantic>=2.8,<3",
    "uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_hub"]

[tool.ruff]
line-length = 100
target-version = "py310"

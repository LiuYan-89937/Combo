<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FastAgentHub 审核</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background:#f5f7fb; color:#18202b }
    * { box-sizing:border-box }
    body { margin:0 }
    header { height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 28px; background:#fff; border-bottom:1px solid #e5e9f0 }
    header h1 { font-size:18px; margin:0 }
    main { max-width:1180px; margin:28px auto; padding:0 20px }
    button { border:0; border-radius:8px; padding:9px 14px; cursor:pointer; font-weight:600 }
    button.primary { background:#1e66f5; color:#fff }
    button.danger { background:#fff0f0; color:#bd2525 }
    button.ghost { background:#eef2f8; color:#344054 }
    button:disabled { opacity:.5; cursor:not-allowed }
    .panel { background:#fff; border:1px solid #e2e7ef; border-radius:14px; box-shadow:0 8px 30px rgba(31,45,61,.05) }
    .empty,.login { padding:52px 24px; text-align:center; color:#667085 }
    .toolbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px }
    .toolbar h2 { margin:0; font-size:17px }
    .release { padding:20px; border-bottom:1px solid #edf0f5 }
    .release:last-child { border-bottom:0 }
    .release-head { display:flex; gap:14px; align-items:flex-start; justify-content:space-between }
    .release h3 { margin:0 0 6px; font-size:16px }
    .meta { color:#667085; font-size:13px }
    .tags { display:flex; gap:7px; flex-wrap:wrap; margin:13px 0 }
    .tag { background:#f0f4fa; border-radius:999px; padding:4px 9px; font-size:12px }
    details { margin-top:12px; border:1px solid #e7ebf1; border-radius:9px; padding:10px 12px }
    summary { cursor:pointer; font-weight:600 }
    pre { overflow:auto; white-space:pre-wrap; word-break:break-word; font-size:12px; color:#475467 }
    .actions { display:flex; gap:8px; margin-top:14px }
    .error { color:#b42318; background:#fff1f0; border:1px solid #ffd2cf; padding:10px 12px; border-radius:8px; margin-bottom:14px }
    .published-heading { margin-top:28px }
    .hidden { display:none }
  </style>
</head>
<body>
  <header>
    <h1>FastAgentHub 审核控制台</h1>
    <div id="identity" class="meta"></div>
  </header>
  <main>
    <div id="error" class="error hidden"></div>
    <section id="login" class="panel login hidden">
      <p>仅允许审核管理员访问。</p>
      <button class="primary" onclick="location.href='/api/v1/auth/github/login'">使用 GitHub 登录</button>
    </section>
    <section id="console" class="hidden">
      <div class="toolbar">
        <h2>待审核版本</h2>
        <button class="ghost" id="refresh">刷新</button>
      </div>
      <div id="releases" class="panel"></div>
      <div class="toolbar published-heading">
        <h2>已发布版本</h2>
      </div>
      <div id="published" class="panel"></div>
    </section>
  </main>
  <script>
    const state = { user: null, busy: null }
    const el = id => document.getElementById(id)
    const text = value => String(value ?? '')
    const escapeHtml = value => text(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))
    async function api(path, init = {}) {
      const response = await fetch(path, { ...init, headers: {'Content-Type':'application/json', ...(init.headers || {})} })
      if (!response.ok) {
        const payload = await response.json().catch(() => ({}))
        throw new Error(payload?.error?.message || `HTTP ${response.status}`)
      }
      return response.json()
    }
    function showError(error) {
      el('error').textContent = error instanceof Error ? error.message : text(error)
      el('error').classList.remove('hidden')
    }
    async function initialize() {
      try {
        state.user = await api('/api/v1/auth/me')
      } catch {
        el('login').classList.remove('hidden')
        return
      }
      if (!state.user.is_admin) {
        showError('当前 GitHub 账号没有审核权限。')
        return
      }
      el('identity').textContent = state.user.github_login
      el('console').classList.remove('hidden')
      await loadReleases()
    }
    async function loadReleases() {
      el('error').classList.add('hidden')
      try {
        const [pending, published] = await Promise.all([
          api('/api/v1/admin/releases/pending'),
          api('/api/v1/admin/releases/published')
        ])
        renderPending(pending)
        renderPublished(published)
      } catch (error) {
        showError(error)
      }
    }
    function renderPending(items) {
      if (!items.length) {
        el('releases').innerHTML = '<div class="empty">当前没有待审核版本</div>'
        return
      }
      el('releases').innerHTML = items.map(item => {
        const validation = item.validation || {}
        const dependencies = validation.dependencies || {}
        const tools = validation.tools || {}
        return `<article class="release">
          <div class="release-head">
            <div>
              <h3>${escapeHtml(item.name)} <span class="meta">${escapeHtml(item.version)}</span></h3>
              <div class="meta">${escapeHtml(item.publisher)}/${escapeHtml(item.package_id)} · ${escapeHtml(item.sha256)}</div>
            </div>
            <div class="meta">${(Number(item.size_bytes) / 1048576).toFixed(2)} MB</div>
          </div>
          <div class="tags">
            <span class="tag">Python ${Number(dependencies.python_count || 0)}</span>
            <span class="tag">npm ${Number(dependencies.npm_count || 0)}</span>
            <span class="tag">系统依赖 ${Number(dependencies.system_count || 0)}</span>
            <span class="tag">包工具 ${(tools.package_tools || []).length}</span>
            <span class="tag">MCP ${(tools.mcp_servers || []).length}</span>
          </div>
          <div>${escapeHtml(item.description || '无描述')}</div>
          <details><summary>完整静态验证报告</summary><pre>${escapeHtml(JSON.stringify(validation, null, 2))}</pre></details>
          <div class="actions">
            <button class="primary" onclick="review('${escapeHtml(item.release_id)}','approve')">批准发布</button>
            <button class="danger" onclick="review('${escapeHtml(item.release_id)}','reject')">驳回</button>
          </div>
        </article>`
      }).join('')
    }
    function renderPublished(items) {
      if (!items.length) {
        el('published').innerHTML = '<div class="empty">当前没有已发布版本</div>'
        return
      }
      el('published').innerHTML = items.map(item => `<article class="release">
        <div class="release-head">
          <div>
            <h3>${escapeHtml(item.name)} <span class="meta">${escapeHtml(item.version)}</span></h3>
            <div class="meta">${escapeHtml(item.publisher)}/${escapeHtml(item.package_id)} · 下载 ${Number(item.download_count || 0)}</div>
          </div>
          <button class="danger" onclick="unpublish('${escapeHtml(item.release_id)}')">下架</button>
        </div>
      </article>`).join('')
    }
    async function review(releaseId, action) {
      if (state.busy) return
      const message = action === 'reject' ? prompt('请输入驳回原因') : ''
      if (action === 'reject' && !message?.trim()) return
      state.busy = releaseId
      try {
        await api(`/api/v1/admin/releases/${encodeURIComponent(releaseId)}/${action}`, {
          method:'POST', body:JSON.stringify({message:message || ''})
        })
        await loadReleases()
      } catch (error) {
        showError(error)
      } finally {
        state.busy = null
      }
    }
    async function unpublish(releaseId) {
      const message = prompt('请输入下架原因')
      if (!message?.trim()) return
      try {
        await api(`/api/v1/admin/releases/${encodeURIComponent(releaseId)}/unpublish`, {
          method:'POST', body:JSON.stringify({message})
        })
        await loadReleases()
      } catch (error) {
        showError(error)
      }
    }
    el('refresh').addEventListener('click', loadReleases)
    initialize()
  </script>
</body>
</html>

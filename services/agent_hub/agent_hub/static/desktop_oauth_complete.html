<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>FastAgentFactory 授权完成</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff;
      color: #171717;
    }
    * { box-sizing: border-box }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 15%, rgba(0, 0, 0, .035), transparent 38%),
        #fff;
    }
    main {
      width: min(440px, 100%);
      padding: 38px;
      text-align: center;
      border: 1px solid rgba(0, 0, 0, .08);
      border-radius: 24px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, .08);
      background: rgba(255, 255, 255, .92);
    }
    .mark {
      width: 52px;
      height: 52px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: #000;
      color: #fff;
      font-size: 25px;
      font-weight: 700;
    }
    h1 { margin: 0; font-size: 24px; letter-spacing: -.02em }
    p { margin: 12px 0 0; color: #737373; line-height: 1.65 }
    @media (prefers-color-scheme: dark) {
      :root, body { background: #000; color: #fafafa }
      body {
        background:
          radial-gradient(circle at 50% 15%, rgba(255, 255, 255, .08), transparent 38%),
          #000;
      }
      main {
        border-color: rgba(255, 255, 255, .1);
        box-shadow: 0 18px 60px rgba(0, 0, 0, .7);
        background: rgba(10, 10, 10, .94);
      }
      .mark { background: #fff; color: #000 }
      p { color: #a3a3a3 }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">F</div>
    <h1>GitHub 授权已完成</h1>
    <p>FastAgentFactory 会自动完成登录。现在可以关闭此页面并返回应用。</p>
  </main>
</body>
</html>

server {
    listen 80;
    listen [::]:80;
    server_name liuyanai.top;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name liuyanai.top;

    ssl_certificate /etc/letsencrypt/live/liuyanai.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liuyanai.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Uploads go direct to OSS via signed URLs; only small JSON hits the API.
    client_max_body_size 1m;

    # Static SPA served from disk; index.html is the fallback for client routes.
    root /var/www/combo-service;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Hashed build assets are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SEO/static files served as-is, no SPA fallback.
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location = /favicon.png { try_files $uri =404; }
    location = /og-cover.png { try_files $uri =404; }

    # SPA fallback: real files win, otherwise index.html handles the route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
